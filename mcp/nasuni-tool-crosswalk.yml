name: Nasuni Portal MCP <-> Portal REST API crosswalk
note: >-
  The Portal MCP Server is documented by Nasuni as a pass-through to the Portal API, so almost
  every published tool has a backing REST operation. Bindings are by name + semantics: the live
  MCP endpoint is per-account and unpublished, so tools/list could not be called and no tool's
  real inputSchema was observed. Confidence is set accordingly — `high` where the tool name and
  the operationId describe the same resource unambiguously, `medium` where the Ops IQ tool
  aggregates or reshapes one telemetry operation, `low`/`mcp_only` where the tool is a narrative
  guide or a composite analysis with no single backing operation.
