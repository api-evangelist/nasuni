rest_only:
  note: >-
    The MCP server is read-and-analyse only. Every write, credential and lifecycle operation in the
    Portal API is absent from the published tool list — this is the crosswalk's most important
    finding for an agent operator: an agent connected to the Portal MCP Server cannot mutate the
    estate.
  families:
  - family: Auth
    operations: [authorize_auth_token_post, revoke_auth_token_delete, refresh_auth_token_refresh_post, mcp_authorize_auth_mcp_post]
    note: POST /auth/mcp is the Portal API operation backing the MCP server's own OAuth exchange.
  - family: Account Management
    operations: [get_account_information_account_get, update_account_information_account_patch, get_account_license_account_license_get, get_account_ai_activate_info_account_ai_activate_get]
  - family: AI Activate
    operations: [get_ai_activate_inventories_ai_activate_inventories_get, create_ai_activate_inventory_ai_activate_inventories_post, get_ai_activate_indexes_ai_activate_indexes_get, create_ai_activate_index_ai_activate_indexes_post, get_mcp_volume_config_ai_activate_indexes__volume_id__mcp_get, update_mcp_volume_config_ai_activate_indexes__volume_id__mcp_patch]
    note: >-
      AI Activate builds searchable indexes over Nasuni volumes and carries its own per-volume MCP
      configuration operations — a second, data-plane MCP surface distinct from the Portal MCP
      Server, with no tool exposed for it.
  - family: Cloud Credentials
    operations: [get_cloud_credentials_cloud_credentials_get, create_credential_cloud_credentials_post, update_credential_cloud_credentials__credential_id__patch, delete_cloud_credential_cloud_credentials__credential_id__delete, create_export_cloud_credentials_exports_post]
  - family: Configuration
    operations: [get_sso_config_configuration_sso_get, set_sso_config_configuration_sso_put, get_s3_edge_config_configuration_s3_edge_get, set_s3_edge_config_configuration_s3_edge_post, delete_s3_edge_config_configuration_s3_edge_delete, get_web_access_sso_config_configuration_web_access_sso_get]
  - family: IAM (write)
    operations: [create_role_iam_roles_post, update_role_iam_roles__role_id__patch, delete_role_iam_roles__role_id__delete, duplicate_role_iam_roles_duplicate_post, create_service_key_iam_service_keys_post, delete_service_key_iam_service_keys__service_key_id__delete, create_user_key_iam_user_keys_post, delete_user_key_iam_user_keys__user_key_id__delete]
  - family: Volumes (write)
    operations: [start_snapshot_volumes__volume_id__edges__edge_id__snapshots_post, cancel_snapshot_volumes__volume_id__edges__edge_id__snapshots_delete, get_volume_capacity_history_volumes__volume_id__capacity_history_get]
  - family: UaaS (write)
    operations: [update_stack_uaas_stacks__stack_id__patch, update_nds_config_uaas_stacks__stack_id__nds_patch, add_stack_volume_uaas_stacks__stack_id__volumes__volume_id__post, delete_stack_volume_uaas_stacks__stack_id__volumes__volume_id__delete, generate_sas_token_uaas_stacks__stack_id__nds_sas_token_post, regenerate_blob_access_key_uaas_stacks__stack_id__nds_blob_keys__blob_key_id__patch]
  - family: GFA
    operations: [get_gfa_api_keys_gfa_api_keys_get, generate_gfa_api_key_gfa_api_keys_post, delete_gfa_api_key_gfa_api_keys__api_key__delete]
  - family: Jobs / Serials / Software / Notifications / Health
    operations: [get_jobs_jobs_get, get_job_jobs__job_id__get, acknowledge_failed_job_jobs__job_id__acknowledge_post, get_serials_serials_get, get_downloads_software_downloads_get, get_notifications_notifications_get, get_health_get]
