name: Nasuni authentication profile
docs:
- api: Nasuni Management Console (NMC) API
  url: https://docs.api.nasuni.com/api/nmc/v120/introduction/
- api: Nasuni Portal API
  url: https://docs.api.nasuni.com/api/portal/v0/introduction/
- api: Nasuni Data API
  url: https://docs.nasuni.com/docs/nasuni-data-api
- api: Nasuni Portal MCP Server
  url: https://docs.nasuni.com/docs/portal-mcp-server
profiles:
- api: Nasuni Management Console (NMC) API
  scheme: opaque bearer token
  header: 'Authorization: Token <token>'
  token_endpoint: POST /auth/login/ with {username, password} -> {token, expires}
  revoke: POST /auth/logout/
  identity_sources:
  - native NMC accounts
  - Active Directory domain accounts (UPN user@domain.com or DOMAIN\\samaccountname)
  sso_supported: false
  sso_note: SSO accounts are explicitly NOT supported for NMC API authentication.
  authorization: The account must be in an NMC group with "Enable NMC API Access" AND hold the specific NMC permission
    for each action (e.g. "Manage Folder Quotas").
  auth_rate_limit: 10 login requests per minute
  source: https://docs.api.nasuni.com/api/nmc/v120/introduction/
- api: Nasuni Portal API
  scheme: OAuth 2.0 client credentials -> JWT bearer; legacy key headers also accepted
  schemes:
  - OAuth2ClientCredentials (RFC 6749 §4.4)
  - HTTPBearer (JWT)
  - ServiceKeyHeader x-service-key + ServiceSecretHeader x-service-secret
  - UserKeyHeader x-user-key
  token_endpoint: 'POST /auth/token (application/x-www-form-urlencoded: grant_type=client_credentials, client_id,
    client_secret)'
  refresh: POST /auth/token/refresh
  revoke: DELETE /auth/token
  mcp_authorize: POST /auth/mcp
  key_management: Service keys and user keys are issued and revoked through the IAM surface (/iam/service_keys,
    /iam/user_keys).
  authorization: Role-based. GET /iam/me returns the caller's roles and permissions; GET /iam/permissions lists
    every permission in the system.
  source: https://docs.api.nasuni.com/api/portal/v0/introduction/
- api: Nasuni Portal MCP Server
  scheme: OAuth 2.0 authorization code with Dynamic Client Registration
  flow: authorization_code
  client_registration: RFC 7591 Dynamic Client Registration
  token_refresh: automatic
  authorization: Inherits the caller's Portal RBAC; no privilege elevation possible through the server.
  source: https://docs.nasuni.com/docs/portal-mcp-server
- api: Nasuni Data Service (NDS) for AWS
  scheme: AWS Signature Version 4, or presigned URLs
  headers:
  - 'Authorization: AWS4-HMAC-SHA256 ...'
  - X-Amz-Date
  - X-Amz-Content-Sha256
  - X-Amz-Security-Token
  source: openapi/_original/nasuni-nasuni-data-service-aws-openapi.json
- api: Nasuni Data Service (NDS) for Azure
  scheme: Azure Shared Key header, or SAS query parameters (sv, ss, srt, sp, se, st, sig)
  note: Shared Key and SAS must not be combined.
  key_management: Keys generated at NDS deployment; listed/rotated via the Portal API /uaas/stacks/{stack_id}/nds/blob-keys
    and /nds/sas-token.
  source: openapi/_original/nasuni-nasuni-data-service-azure-openapi.json
- api: Global File Acceleration (GFA) Telemetry API
  scheme: API token in the Authorization header
  key_management: GFA API keys are issued and revoked through the Portal API (/gfa/api_keys).
  source: openapi/_original/nasuni-global-file-acceleration-telemetry-openapi.json
- api: Nasuni Data API (mobileapi)
  scheme: secret-key token presented as HTTP Basic
  token_endpoint: 'POST /mobileapi/1/auth/login (multipart form: username, password, device_id, device_type) ->
    x-secret-key response header'
  usage: Subsequent calls send HTTP Basic with username=device_id and password=the x-secret-key value.
  prerequisite: Mobile Access must be enabled on the share (Sync and Mobile Access on the NMC Shares page).
  note: As of Nasuni 10.1 most response headers are lowercase; earlier versions returned X-Secret-Key.
  source: https://docs.nasuni.com/docs/nasuni-data-api
note: Seven contracts, six distinct authentication models, none of them shared. The NMC API and the Portal API do
  not accept each other's credentials, and the two NDS surfaces deliberately adopt the native auth of the cloud
  they emulate. Only the Portal API and the Portal MCP Server use OAuth 2.0.
