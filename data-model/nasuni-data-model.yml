- entities: [Filer, Edge Appliance]
  nmc_key: filer_serial
  portal_key: edge_id
  telemetry_key: serial_number
  note: >-
    Ops IQ telemetry paths use serial_number, which matches NMC's filer_serial. edge_id is a Portal-
    internal identifier. Joining NMC and Portal data on the appliance requires resolving edge_id to
    a serial via GET /edges/{edge_id}.
