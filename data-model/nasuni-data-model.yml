entities:
- name: Account
  apis: [NMC, Portal]
  description: The customer tenancy. Root of the Portal graph; carries licence and AI Activate state.
- name: Filer / Edge Appliance
  apis: [NMC, Portal]
  description: >-
    A caching appliance at a site. Carries CPU/RAM/disk specs, build version, IP, location, and
    service flags for S3 Edge and File IQ.
- name: Volume
  apis: [NMC, Portal]
  description: >-
    A UniFS namespace backed by object storage. Connected to one or more appliances; owns shares,
    exports, snapshots, quotas and global-lock folders.
- name: Share
  apis: [NMC]
  description: A CIFS/SMB share exposed by one appliance on one volume.
- name: Export
  apis: [NMC]
  description: An NFS export exposed by one appliance on one volume; owns host options.
- name: Snapshot
  apis: [NMC, Portal]
  description: >-
    An immutable point-in-time version of a volume, taken by an appliance and propagated to others.
