name: Nasuni entity-relationship model
note: >-
  Derived from path structure and identifier fields rather than from a published object reference —
  Nasuni does not publish one. The NMC and Portal APIs model the SAME physical estate through two
  different vocabularies: what NMC calls a "Filer" (identified by filer_serial) the Portal calls an
  "Edge" (identified by edge_id), and NMC identifies volumes by volume_guid while the Portal uses
  volume_id. Any agent working across both contracts must reconcile these itself; no mapping
  endpoint is published.
