apis:
- name: Nasuni Data API
  description: >-
    HTTP API providing programmatic access to the filesystem of a Nasuni Edge Appliance — create, read,
    update and delete files and folders, list shares, and read previous versions. Requires Mobile Access
    to be enabled on the share. Authentication issues an x-secret-key token from /mobileapi/1/auth/login
    which is then presented as HTTP Basic credentials alongside the device_id. Documented in prose only;
    Nasuni publishes no OpenAPI for this surface.
  humanURL: https://docs.nasuni.com/docs/nasuni-data-api
  baseURL: https://hostname/mobileapi/1
  tags:
  - File Storage
  - Data Management
  properties:
  - type: Documentation
    url: https://docs.nasuni.com/docs/nasuni-data-api
- name: Nasuni Portal MCP Server
  description: >-
    Hosted, OAuth 2.0-authenticated Model Context Protocol server that exposes the Nasuni Portal to AI
    clients (Claude, ChatGPT, Microsoft Copilot Studio) as roughly 40 tools spanning appliance and volume
    inventory, Nasuni Data Services and SRaaS configuration, activity logs, roles and permissions, and
    the Ops IQ telemetry, data-protection, health, TCO/rightsizing and diagnostic families. Regional endpoints;
    the per-account URL is retrieved from Portal → Account Settings → Integrations. Currently in private
    preview. RBAC is inherited from the caller's Portal account.
  humanURL: https://docs.nasuni.com/docs/portal-mcp-server
  baseURL: https://am1.portal.api.nasuni.com
  tags:
  - MCP
  - agent-native
  - Observability
  properties:
  - type: MCPServer
    url: mcp/nasuni-mcp.yml
  - type: ToolCrosswalk
    url: mcp/nasuni-tool-crosswalk.yml
  - type: Documentation
