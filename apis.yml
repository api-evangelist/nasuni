apis:
- name: Nasuni Management Console (NMC) API
  description: REST API to monitor and configure the Nasuni resources managed by a Nasuni Management Console, emulating
    the NMC web interface. Covers account, authentication, Edge Appliance (filer) inventory and configuration, CIFS/NFS/FTP
    shares and clients, volumes, snapshots, quotas, antivirus, cloud credentials, messages and notifications. Token authentication
    via the Authorization header; versions 1.0, 1.1 and 1.2 are published side by side. The NMC is customer-hosted, so the
    published server is the templated https://hostname/api/v1.2 form rather than a Nasuni-operated host.
  humanURL: https://docs.api.nasuni.com/api/nmc/v120/introduction/
  baseURL: https://hostname/api/v1.2
  tags:
  - File Storage
  - Enterprise Storage
  - Infrastructure
  - Data Management
  properties:
  - type: OpenAPI
    url: openapi/nasuni-nmc-v1-2-openapi.yml
  - type: OpenAPI
    url: openapi/nasuni-nmc-v1-1-openapi.yml
  - type: OpenAPI
    url: openapi/nasuni-nmc-v1-0-openapi.yml
  - type: Documentation
    url: https://docs.api.nasuni.com/api/nmc/v120/introduction/
  - type: APIReference
    url: https://docs.api.nasuni.com/api/nmc/v120/reference/overview/
  - type: ChangeLog
    url: https://docs.api.nasuni.com/api/nmc/v120/versionhistory/
- name: Nasuni Portal API
  description: Multi-region REST API for the Nasuni Portal control plane — account management, IAM, roles and permissions,
    serials and software, Edge and File IQ appliance inventory, volumes and volume connections, cloud credentials, UniFS
    as a Service (UaaS), Global File Accelerator, AI Activate, Ops IQ telemetry, activity logs, health and asynchronous
    jobs. Supports OAuth 2.0 client credentials, JWT bearer tokens and legacy service-key headers, with regional base URLs
    for the Americas, EU and Asia-Pacific.
  humanURL: https://docs.api.nasuni.com/api/portal/v0/introduction/
  baseURL: https://am1.portal.api.nasuni.com
  tags:
  - File Storage
  - Hybrid Cloud
  - Observability
  - Data Management
  properties:
  - type: OpenAPI
    url: openapi/nasuni-portal-v0-openapi.yml
  - type: Documentation
    url: https://docs.api.nasuni.com/api/portal/v0/introduction/
  - type: APIReference
    url: https://docs.api.nasuni.com/api/portal/v0/reference/overview/
  - type: ChangeLog
    url: https://docs.api.nasuni.com/api/portal/v0/versionhistory/
- name: Global File Acceleration (GFA) Telemetry API
  description: Telemetry API that returns Global File Acceleration performance metrics from the Nasuni NOC service, for
    use in dashboards and time-series monitoring of accelerated file movement across a Nasuni estate. Authenticated with
    an API token in the Authorization header.
  humanURL: https://docs.api.nasuni.com/api/gfa/reference/overview/
  baseURL: https://gfa-telemetry-us1.api.nasuni.com/v1
  tags:
  - Observability
  - File Storage
  properties:
  - type: OpenAPI
    url: openapi/nasuni-global-file-acceleration-telemetry-openapi.yml
  - type: APIReference
    url: https://docs.api.nasuni.com/api/gfa/reference/overview/
- name: Nasuni Data Service (NDS) for Azure API
  description: Azure Blob Storage-compatible endpoint that exposes data stored in a Nasuni volume to Azure-native tooling
    and analytics/AI services without copying the data. Supports container and blob listing, blob retrieval and blob property
    reads, authenticated with a Shared Key header or SAS query parameters generated at NDS deployment time.
  humanURL: https://docs.nasuni.com/docs/nds-azure-api-overview
  tags:
  - Object Storage
  - Hybrid Cloud
  - Data Management
  properties:
  - type: OpenAPI
    url: openapi/nasuni-nasuni-data-service-azure-openapi.yml
  - type: Documentation
    url: https://docs.nasuni.com/docs/nds-azure-api-overview
  x-baseurl-note: NDS is deployed into the customer's own Azure subscription / AWS account, so there is no Nasuni-operated
    host. Neither published spec carries a servers[] block and neither docs page states a base URL — the endpoint is generated
    at NDS deployment time. Recorded as absent rather than guessed.
- name: Nasuni Data Service (NDS) for AWS API
  description: S3-compatible, read-only endpoints exposed through AWS S3 Object Lambda for accessing data stored in a Nasuni
    volume from AWS-native analytics and AI services. Supports ListObjectsV2, GetObject and HeadObject semantics, authenticated
    with AWS Signature Version 4 or presigned URLs.
  humanURL: https://docs.nasuni.com/docs/nds-aws-api-overview
  tags:
  - Object Storage
  - Hybrid Cloud
  - Data Management
  properties:
  - type: OpenAPI
    url: openapi/nasuni-nasuni-data-service-aws-openapi.yml
  - type: Documentation
    url: https://docs.nasuni.com/docs/nds-aws-api-overview
  x-baseurl-note: NDS is deployed into the customer's own Azure subscription / AWS account, so there is no Nasuni-operated
    host. Neither published spec carries a servers[] block and neither docs page states a base URL — the endpoint is generated
    at NDS deployment time. Recorded as absent rather than guessed.
- name: Nasuni Data API
  description: HTTP API providing programmatic access to the filesystem of a Nasuni Edge Appliance — create, read, update
    and delete files and folders, list shares, and read previous versions. Requires Mobile Access to be enabled on the share.
    Authentication issues an x-secret-key token from /mobileapi/1/auth/login which is then presented as HTTP Basic credentials
    alongside the device_id. Documented in prose only; Nasuni publishes no OpenAPI for this surface.
  humanURL: https://docs.nasuni.com/docs/nasuni-data-api
  baseURL: https://hostname/mobileapi/1
  tags:
  - File Storage
  - Data Management
  properties:
  - type: Documentation
    url: https://docs.nasuni.com/docs/nasuni-data-api
- name: Nasuni Portal MCP Server
  description: Hosted, OAuth 2.0-authenticated Model Context Protocol server that exposes the Nasuni Portal to AI clients
    (Claude, ChatGPT, Microsoft Copilot Studio) as roughly 40 tools spanning appliance and volume inventory, Nasuni Data
    Services and SRaaS configuration, activity logs, roles and permissions, and the Ops IQ telemetry, data-protection, health,
    TCO/rightsizing and diagnostic families. Regional endpoints; the per-account URL is retrieved from Portal → Account
    Settings → Integrations. Currently in private preview. RBAC is inherited from the caller's Portal account.
  humanURL: https://docs.nasuni.com/docs/portal-mcp-server
  baseURL: https://am1.portal.api.nasuni.com
  tags:
  - MCP
  - agent-native
  - Observability
