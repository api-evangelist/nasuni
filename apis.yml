aid: nasuni
name: Nasuni
description: 'Nasuni is an enterprise hybrid-cloud file data platform that consolidates distributed NAS and file servers
  into UniFS, a cloud-native global file system backed by customer-owned object storage (Azure Blob, Amazon S3, Google Cloud
  Storage and S3-compatible on-prem targets). Edge appliances cache hot data at each site while every version is written
  immutably to the cloud, delivering multi-site collaboration with Global File Lock and Global File Acceleration, continuous
  versioning, rapid ransomware recovery, and file data services for analytics and AI. Nasuni exposes a substantial programmable
  surface: the REST Nasuni Management Console (NMC) API for fleet, volume, share, snapshot and appliance management; the
  multi-region Nasuni Portal API for account, IAM, Ops IQ telemetry, UaaS and job orchestration; the Global File Acceleration
  Telemetry API; Nasuni Data Service (NDS) endpoints that present Nasuni volumes through Azure Blob- and Amazon S3-compatible
  interfaces; the Nasuni Data API for appliance filesystem access; and a hosted, OAuth 2.0 Portal MCP Server plus open-source
  local MCP servers that make the platform callable by AI agents.'
