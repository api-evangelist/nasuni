openapi: 3.2.0
info:
  title: Nasuni Notifications API
  version: '1.0'
  description: 'Operations tagged Notifications across 4 of this provider''s published API definitions: nasuni-nmc-v1-0-openapi.json, nasuni-nmc-v1-1-openapi.json, nasuni-nmc-v1-2-openapi.json, nasuni-portal-v0-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://hostname/api/v1
- url: https://hostname/api/v1.1
- url: https://hostname/api/v1.2
- url: https://am1.portal.api.nasuni.com
  description: Base URL for accounts assigned the US region.
- url: https://eu1.portal.api.nasuni.com
  description: Base URL for accounts assigned the EU region.
- url: https://ap1.portal.api.nasuni.com
  description: Base URL for accounts assigned the Asia-Pacific region.
tags:
- name: Notifications
paths:
  /notifications/:
    get:
      tags:
      - Notifications
      summary: List all notifications
      parameters:
      - name: limit
        in: query
        description: The maximum number of objects to return
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 50
      - name: offset
        in: query
        description: The index of the first object to return
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notification'
                - $ref: '#/components/schemas/Paging'
        '401':
          description: Authentication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - AuthToken: []
      operationId: getNotifications
      x-operation-id-source: derived
    servers:
    - url: https://hostname/api/v1
  /notifications/{notification_id}/:
    get:
      tags:
      - Notifications
      summary: Get a notification
      parameters:
      - name: notification_id
        in: path
        description: Notification object identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          description: Authentication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - AuthToken: []
      operationId: getNotificationsByNotificationId
      x-operation-id-source: derived
    servers:
    - url: https://hostname/api/v1
  /notifications:
    get:
      tags:
      - Notifications
      summary: Get All Notifications
      description: 'Get paginated notifications with optional filters.


        Returns notifications from the last 15 minutes by default if no date range is specified.

        Supports cursor-based pagination.


        Args:

        filter_query: Filter parameters including dates, severity, category, appliance_name, volume_name and search


        Returns:

        NotificationsDto: Paginated list of notifications'
      operationId: get_notifications_notifications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Start date filter. If not provided, defaults to 15 minutes ago.
          examples:
          - '2026-02-09T00:00:00Z'
          - '2026-02-01T00:00:00Z'
          title: Start Date
        description: Start date filter. If not provided, defaults to 15 minutes ago.
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: End date filter. If not provided, defaults to the current date and time.
          examples:
          - '2026-02-16T23:59:59Z'
          - '2026-02-28T23:59:59Z'
          title: End Date
        description: End date filter. If not provided, defaults to the current date and time.
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/NotificationSeverity'
          - type: 'null'
          description: Defaults to all severities if not provided
          examples:
          - WARNING
          - ALERT
          - INFO
          title: Severity
        description: Defaults to all severities if not provided
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/NotificationCategory'
          - type: 'null'
          description: Defaults to all categories if not provided
          examples:
          - Snapshots & Sync
          - Restore & Recovery
          - Cyber Resilience
          title: Category
        description: Defaults to all categories if not provided
      - name: sub_category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/NotificationSubCategory'
          - type: 'null'
          description: Defaults to all sub-categories if not provided
          examples:
          - Snapshot
          - Sync
          - Ransomware
          title: Sub Category
        description: Defaults to all sub-categories if not provided
      - name: appliance_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Defaults to all appliances if not provided
          examples:
          - edge-001
          - edge-prod-01
          title: Appliance Name
        description: Defaults to all appliances if not provided
      - name: volume_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Defaults to all volumes if not provided
          examples:
          - volume-a
          - production-vol
          title: Volume Name
        description: Defaults to all volumes if not provided
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term for notifications
          examples:
          - backup failed
          - connection timeout
          - storage
          title: Search
        description: Search term for notifications
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: iterator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Iterator Id
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
      - name: sort_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NotificationColumns'
          default: generated_at
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NotificationSortDirection'
          default: desc
      - name: include_count
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Include Count
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsDto'
        '400':
          description: Invalid request parameters (e.g., invalid cursor, limit <= 0, date range > 30 days, cursor parameters mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBaseDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBaseDto'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBaseDto'
        '408':
          description: Database operation timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBaseDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Database connection failed or internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBaseDto'
    servers:
    - url: https://am1.portal.api.nasuni.com
      description: Base URL for accounts assigned the US region.
    - url: https://eu1.portal.api.nasuni.com
      description: Base URL for accounts assigned the EU region.
    - url: https://ap1.portal.api.nasuni.com
      description: Base URL for accounts assigned the Asia-Pacific region.
