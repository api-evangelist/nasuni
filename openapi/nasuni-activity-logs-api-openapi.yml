    AiActivateMcpVolumeConfigDto:
      properties:
        mcp_enabled:
          type: boolean
          title: Mcp Enabled
          description: Whether the MCP server is enabled for this volume.
        allowed_file_extensions:
          items:
            type: string
          type: array
          title: Allowed File Extensions
          description: File extensions the MCP server filters results to. Empty list returns all file types.
          examples:
          - - pdf
            - docx
        period:
          anyOf:
          - type: string
          - type: 'null'
          title: Period
          description: Time-window filter applied to query results. Accepts an ISO 8601 duration (e.g. 'P30D') or explicit interval null means 'all time' — ISO 8601 has no valid 'all time' representation.
          examples:
          - P7D
          - P30D
          - P90D
          - P1Y
          - null
        ignore_principals:
          items:
            type: string
          type: array
          title: Ignore Principals
          description: Principal names (users or groups) whose ALLOW permissions the MCP server ignores.
          examples:
          - - DOMAIN\\contractors
            - service-account@example.com
        ignore_everyone:
          type: boolean
          title: Ignore Everyone
          description: When true, the MCP server ignores the Everyone principal.
          default: false
        ignore_domain_users:
          type: boolean
          title: Ignore Domain Users
          description: When true, the MCP server ignores the Domain Users principal.
          default: false
      type: object
      required:
      - mcp_enabled
      title: AiActivateMcpVolumeConfigDto
      description: 'MCP query-scope configuration for a single indexed volume.


        Returned by GET /ai_activate/indexes/{volume_id}/mcp and by

        PATCH /ai_activate/indexes/{volume_id}/mcp after a successful update.'
