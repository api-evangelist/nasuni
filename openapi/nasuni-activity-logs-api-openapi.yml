openapi: 3.2.0
info:
  title: Portal Activity Logs API
  version: 0.1.0
servers:
- url: https://am1.portal.api.nasuni.com
  description: Base URL for accounts assigned the US region.
- url: https://eu1.portal.api.nasuni.com
  description: Base URL for accounts assigned the EU region.
- url: https://ap1.portal.api.nasuni.com
  description: Base URL for accounts assigned the Asia-Pacific region.
security:
- HTTPBearer: []
tags:
- name: Activity Logs
paths:
  /activity-logs/records:
    get:
      tags:
      - Activity Logs
      summary: Get Activity Logs
      operationId: get_records_activity_logs_records_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Date
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
      - name: target
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ActivityLogTarget'
          - type: 'null'
          title: Target
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ActivityLogAction'
          - type: 'null'
          title: Action
      - name: transaction_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Transaction Id
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 500
          title: Limit
      - name: iterator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Iterator Id
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
      - name: sort_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ActivityLogSortBy'
          default: timestamp
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: descending
      responses:
        '200':
          description: Activity logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogResultDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /activity-logs/records/{record_id}:
    get:
      tags:
      - Activity Logs
      summary: Get Activity Log
      operationId: get_record_activity_logs_records__record_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Record Id
      responses:
        '200':
          description: Activity log retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CloudCredentialErrorAcknowledged:
      properties:
        action:
          type: string
          const: Cloud Credential Error Acknowledged
          title: Action
        name:
          type: string
          title: Name
        edge_name:
          type: string
          title: Edge Name
      type: object
      required:
      - action
      - name
      - edge_name
      title: CloudCredentialErrorAcknowledged
    StackVolumeRemoved:
      properties:
        action:
          type: string
          const: Stack Volume Removed
          title: Action
        volume_id:
          type: string
          title: Volume Id
        old:
          anyOf:
          - $ref: '#/components/schemas/UaasVolumeNdsDto'
          - type: 'null'
      type: object
      required:
      - action
      - volume_id
      title: StackVolumeRemoved
    S3EdgeConfigDto:
      properties:
        buckets:
          items:
            anyOf:
            - $ref: '#/components/schemas/Bucket'
            - $ref: '#/components/schemas/BucketSDDL'
          type: array
          title: Buckets
        keys:
          items:
            $ref: '#/components/schemas/Key'
          type: array
          title: Keys
      type: object
      required:
      - buckets
      - keys
      title: S3EdgeConfigDto
    AiActivateMcpConfigUpdated:
      properties:
        action:
          type: string
          const: AI Activate MCP Config Updated
          title: Action
        volume_id:
          type: string
          title: Volume Id
        volume_name:
          type: string
          title: Volume Name
          default: ''
        old:
          anyOf:
          - $ref: '#/components/schemas/AiActivateMcpVolumeConfigDto'
          - type: 'null'
        new:
          anyOf:
          - $ref: '#/components/schemas/AiActivateMcpVolumeConfigDto'
          - type: 'null'
      type: object
      required:
      - action
      - volume_id
      title: AiActivateMcpConfigUpdated
    UaasStackNdsSimplifiedDto:
      properties:
        azure_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Azure Enabled
        s3:
          anyOf:
          - $ref: '#/components/schemas/UaasS3ConfigDto'
          - $ref: '#/components/schemas/UaasS3ConfigRevealedDto'
          - type: 'null'
          title: S3
        azure_keys:
          anyOf:
          - items:
              $ref: '#/components/schemas/UaasBlobAccessKeyBaseDto'
            type: array
          - type: 'null'
          title: Azure Keys
        excluded_paths:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Excluded Paths
        included_paths:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Included Paths
        azure_volumes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Azure Volumes
      type: object
      title: UaasStackNdsSimplifiedDto
    AiActivateIndexDetailsDto:
      properties:
        volume_guid:
          type: string
          title: Volume Guid
        volume_name:
          type: string
          title: Volume Name
        provider:
          type: string
          title: Provider
        volume_region:
          anyOf:
          - type: string
          - type: 'null'
          title: Volume Region
          description: Storage region of the volume. May be null when NOC has no volume metadata.
        status:
          $ref: '#/components/schemas/AiActivateIndexStatus'
        file_count:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: File Count
          description: Number of files indexed for the volume. May be null until NOC reports a count.
        volume_size:
          anyOf:
          - type: string
          - type: 'null'
          title: Volume Size
          description: Human-readable volume size string e.g. '10.5 TB'. May be unavailable until indexing progresses.
        include_paths:
          items:
            type: string
          type: array
          title: Include Paths
        exclude_paths:
          items:
            type: string
          type: array
          title: Exclude Paths
        mcp_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Mcp Enabled
          deprecated: true
      type: object
      required:
      - volume_guid
      - volume_name
      - provider
      - status
      title: AiActivateIndexDetailsDto
      description: 'Full AI Activate index detail for a volume — list-item fields plus search configuration.


        Returned by the webapi GET/POST/PATCH ``/ai_activate/indexes/{volume_id}``

        endpoints so external API consumers see the same volume/index metadata as

        the list endpoint alongside the search configuration in a single response.'
    CloudCredentialDeleteFailed:
      properties:
        action:
          type: string
          const: Cloud Credential Delete Failed
          title: Action
        name:
          type: string
          title: Name
        edge_name:
          type: string
          title: Edge Name
        error:
          type: string
          title: Error
      type: object
      required:
      - action
      - name
      - edge_name
      - error
      title: CloudCredentialDeleteFailed
    UaasS3ConfigDto:
      properties:
        aws_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Aws Enabled
        aws_volumes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Aws Volumes
      type: object
      title: UaasS3ConfigDto
    UaasBlobAccessKeyDto:
      properties:
        access_key:
          type: string
          format: password
          title: Access Key
          writeOnly: true
        generated:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generated
        id:
          type: string
          format: uuid
          title: Id
        connection_string:
          type: string
          title: Connection String
      type: object
      required:
      - access_key
      - id
      - connection_string
      title: UaasBlobAccessKeyDto
      description: DTO for Azure Blob Access Keys used in UaaS stacks
    Key:
      properties:
        name:
          type: string
          title: Name
        access:
          type: string
          title: Access
        secret:
          type: string
          title: Secret
      type: object
      required:
      - name
      - access
      - secret
      title: Key
    portal__api__dto__activity_logs__EventDetails__Role:
      properties:
        action:
          type: string
          enum:
          - Role Created
          - Role Deleted
          title: Action
        item:
          $ref: '#/components/schemas/ActivityLogsRoleDto'
      type: object
      required:
      - action
      - item
      title: Role
    FiqEdgeDto:
      properties:
        serial_number:
          type: string
          format: uuid
          title: Serial Number
        id:
          type: string
          format: uuid
          title: Id
        build:
          type: string
          title: Build
        description:
          type: string
          title: Description
        fiq_service_enabled:
          type: boolean
          title: Fiq Service Enabled
      type: object
      required:
      - serial_number
      - id
      - build
      - description
      - fiq_service_enabled
      title: FiqEdgeDto
    AiActivateRemoteSupportDto:
      properties:
        remote_support:
          type: boolean
          title: Remote Support
      type: object
      required:
      - remote_support
      title: AiActivateRemoteSupportDto
    StackNDSConfigUpdate:
      properties:
        action:
          type: string
          const: Stack NDS Configuration Updated
          title: Action
        old:
          anyOf:
          - $ref: '#/components/schemas/UaasStackNdsSimplifiedDto'
          - $ref: '#/components/schemas/UaasStackNdsConfigDto'
          - type: 'null'
          title: Old
        new:
          anyOf:
          - $ref: '#/components/schemas/UaasStackNdsSimplifiedDto'
          - $ref: '#/components/schemas/UaasStackNdsConfigDto'
          - type: 'null'
          title: New
      type: object
      required:
      - action
      title: StackNDSConfigUpdate
    AuthCode:
      properties:
        action:
          type: string
          enum:
          - Auth Code Requested
          - Auth Code Reset
          - Serial Number Decommission
          title: Action
      type: object
      required:
      - action
      title: AuthCode
    SnapshotEvent:
      properties:
        action:
          type: string
          enum:
          - Snapshot Started
          - Snapshot Cancelled
          title: Action
        volume_id:
          type: string
          title: Volume Id
        volume_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Volume Name
        edge_id:
          type: string
          format: uuid
          title: Edge Id
        task_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Task Id
      type: object
      required:
      - action
      - volume_id
      - edge_id
      title: SnapshotEvent
    RoleUpdated:
      properties:
        action:
          type: string
          const: Role Updated
          title: Action
        old:
          anyOf:
          - $ref: '#/components/schemas/ActivityLogsRoleDto'
          - type: 'null'
        new:
          anyOf:
          - $ref: '#/components/schemas/ActivityLogsRoleDto'
          - type: 'null'
        item:
          anyOf:
          - $ref: '#/components/schemas/ActivityLogsRoleDto'
          - type: 'null'
      type: object
      required:
      - action
      title: RoleUpdated
    ActivityLogTarget:
      type: string
      enum:
      - Portal
      - Edge
      - File IQ
      - Stack
      title: ActivityLogTarget
    S3EdgeConfigUpdate:
      properties:
        action:
          type: string
          const: S3 Edge Config Updated
          title: Action
        old:
          anyOf:
          - $ref: '#/components/schemas/S3EdgeConfigDto'
          - type: 'null'
        new:
          anyOf:
          - $ref: '#/components/schemas/S3EdgeConfigDto'
          - type: 'null'
      type: object
      required:
      - action
      title: S3EdgeConfigUpdate
    AnalyticsConnectorUpdate:
      properties:
        action:
          type: string
          const: Analytics Connector Updated
          title: Action
        old:
          anyOf:
          - $ref: '#/components/schemas/AnalyticsConnectorDto'
          - type: 'null'
        new:
          anyOf:
          - $ref: '#/components/schemas/AnalyticsConnectorDto'
          - type: 'null'
      type: object
      required:
      - action
      title: AnalyticsConnectorUpdate
    CreatedOrDeleted:
      properties:
        action:
          type: string
          enum:
          - Service Key Created
          - Service Key Deleted
          - User Key Created
          - User Key Deleted
          - GFA API Key Created
          - GFA API Key Deleted
          title: Action
        id:
          type: string
          format: uuid
          title: Id
      type: object
      required:
      - action
      - id
      title: CreatedOrDeleted
    AiActivateIndexConfigUpdated:
      properties:
        action:
          type: string
          const: AI Activate Index Config Updated
          title: Action
        volume_id:
          type: string
          title: Volume Id
        volume_name:
          type: string
          title: Volume Name
          default: ''
        new:
          $ref: '#/components/schemas/AiActivateIndexDetailsDto'
      type: object
      required:
      - action
      - volume_id
      - new
      title: AiActivateIndexConfigUpdated
    StackConfigUpdate:
      properties:
        action:
          type: string
          const: Stack Configuration Updated
          title: Action
        old:
          anyOf:
          - $ref: '#/components/schemas/UaasStackDetailDto'
          - type: 'null'
        new:
          anyOf:
          - $ref: '#/components/schemas/UaasStackDetailDto'
          - type: 'null'
      type: object
      required:
      - action
      title: StackConfigUpdate
    AnalyticsConnectorDto:
      properties:
        key:
          type: string
          format: uuid
          title: Key
        nac_link:
          type: string
          title: Nac Link
        launchable:
          type: boolean
          title: Launchable
        unlicensed:
          type: boolean
          title: Unlicensed
        nac_run_history:
          anyOf:
          - items:
              $ref: '#/components/schemas/NacRunHistoryDto'
            type: array
          - type: 'null'
          title: Nac Run History
        can_generate:
          type: boolean
          title: Can Generate
        can_view:
          type: boolean
          title: Can View
        unifx_aws_ids:
          type: string
          title: Unifx Aws Ids
      type: object
      required:
      - key
      - nac_link
      - launchable
      - unlicensed
      - nac_run_history
      - can_generate
      - can_view
      - unifx_aws_ids
      title: AnalyticsConnectorDto
    KeyType:
      type: string
      enum:
      - service
      - user
      title: KeyType
    Authentication:
      properties:
        action:
          type: string
          enum:
          - Authorized Login
          - Authorized Logout
          title: Action
        auth_method:
          anyOf:
          - $ref: '#/components/schemas/AuthMethod'
          - type: 'null'
      type: object
      required:
      - action
      title: Authentication
    ErrorResponse:
      properties:
        message:
          type: string
          title: Message
        detail:
          anyOf:
          - {}
          - type: 'null'
          title: Detail
      type: object
      required:
      - message
      - detail
      title: ErrorResponse
    UaasBlobAccessKeyRevealedDto:
      properties:
        access_key:
          type: string
          format: password
          title: Access Key
          writeOnly: true
        generated:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generated
        id:
          type: string
          format: uuid
          title: Id
        connection_string:
          type: string
          title: Connection String
      type: object
      required:
      - access_key
      - id
      - connection_string
      title: UaasBlobAccessKeyRevealedDto
    AiActivateIndexCreated:
      properties:
        action:
          type: string
          const: AI Activate Index Created
          title: Action
        volume_id:
          type: string
          title: Volume Id
        volume_name:
          type: string
          title: Volume Name
          default: ''
      type: object
      required:
      - action
      - volume_id
      title: AiActivateIndexCreated
    FiqApplianceDto:
      properties:
        serial_number:
          type: string
          format: uuid
          title: Serial Number
        id:
          type: string
          format: uuid
          title: Id
        description:
          type: string
          title: Description
        build:
          type: string
          title: Build
        enabled:
          type: boolean
          title: Enabled
        connections:
          $ref: '#/components/schemas/FiqConnections'
      type: object
      required:
      - serial_number
      - id
      - description
      - build
      - enabled
      - connections
      title: FiqApplianceDto
    ValidationErrorResponse:
      properties:
        message:
          type: string
          title: Message
        detail:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Detail
          example:
          - ctx:
              error: 'invalid length: expected length 32 for simple format, found 3'
            input: '123'
            loc:
            - path
            - id
            msg: 'Input should be a valid UUID, invalid length: expected length 32 for simple format, found 3'
            type: uuid_parsing
      type: object
      required:
      - message
      - detail
      title: ValidationErrorResponse
    StackVolumeUpdated:
      properties:
        action:
          type: string
          const: Stack Volume Updated
          title: Action
        volume_id:
          type: string
          title: Volume Id
        old:
          anyOf:
          - $ref: '#/components/schemas/UaasVolumeNdsDto'
          - type: 'null'
        new:
          anyOf:
          - $ref: '#/components/schemas/UaasVolumeNdsDto'
          - type: 'null'
      type: object
      required:
      - action
      - volume_id
      title: StackVolumeUpdated
    ActivityLogsKeyDto:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        type:
          $ref: '#/components/schemas/KeyType'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - id
      - type
      title: ActivityLogsKeyDto
    SoftwareDownloadConfigurationUpdate:
      properties:
        action:
          type: string
          const: Software Download Configuration Updated
          title: Action
        old:
          $ref: '#/components/schemas/SoftwareDownloadsConfigurationDto'
        new:
          $ref: '#/components/schemas/SoftwareDownloadsConfigurationDto'
      type: object
      required:
      - action
      - old
      - new
      title: SoftwareDownloadConfigurationUpdate
    SoftwareDownloadsConfigurationDto:
      properties:
        linked_amazon_account_ids:
          items:
            type: string
          type: array
          title: Linked Amazon Account Ids
      type: object
      title: SoftwareDownloadsConfigurationDto
    FiqConfigUpdate:
      properties:
        action:
          type: string
          const: File IQ Config Updated
          title: Action
        old:
          anyOf:
          - $ref: '#/components/schemas/FiqApplianceDto'
          - type: 'null'
        new:
          anyOf:
          - $ref: '#/components/schemas/FiqApplianceDto'
          - type: 'null'
      type: object
      required:
      - action
      title: FiqConfigUpdate
    ActivityLogTargetDto:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
        type:
          $ref: '#/components/schemas/ActivityLogTarget'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - type
      title: ActivityLogTargetDto
    CloudCredentialCreateFailed:
      properties:
        action:
          type: string
          const: Cloud Credential Create Failed
          title: Action
        name:
          type: string
          title: Name
        edge_name:
          type: string
          title: Edge Name
        error:
          type: string
          title: Error
      type: object
      required:
      - action
      - name
      - edge_name
      - error
      title: CloudCredentialCreateFailed
    ActivityLogsUserDto:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - id
      title: ActivityLogsUserDto
    UserCreated:
      properties:
        action:
          type: string
          const: User Created
          title: Action
        item:
          $ref: '#/components/schemas/UserDto'
      type: object
      required:
      - action
      - item
      title: UserCreated
    CloudCredentialUpdateFailed:
      properties:
        action:
          type: string
          const: Cloud Credential Update Failed
          title: Action
        name:
          type: string
          title: Name
        edge_name:
          type: string
          title: Edge Name
        error:
          type: string
          title: Error
      type: object
      required:
      - action
      - name
      - edge_name
      - error
      title: CloudCredentialUpdateFailed
    SSOConfigUpdate:
      properties:
        action:
          type: string
          const: SSO Config Updated
          title: Action
        old:
          anyOf:
          - $ref: '#/components/schemas/SSOConfigDto'
          - type: 'null'
        new:
          anyOf:
          - $ref: '#/components/schemas/SSOConfigDto'
          - type: 'null'
      type: object
      required:
      - action
      title: SSOConfigUpdate
    BucketSDDL:
      properties:
        name:
          type: string
          title: Name
        path:
          type: string
          title: Path
        volume:
          type: string
          title: Volume
        roles:
          anyOf:
          - additionalProperties:
              items:
                type: string
              type: array
            type: object
          - type: 'null'
          title: Roles
