  /volumes/{volume_guid}/filers/{filer_serial}/path/{path}:
    get:
      tags:
      - Volumes
      summary: Get info on a specific path
      description: 'Calling this NMC API endpoint and specifying the Edge Appliance(Filer) serial and path, asks the NMC to give the requestor information it has about the specified path. This only works if the path is a "known path"-- In other words, if the path has recently been enumerated/stated by the NMC file browser or API call (Using "Refresh info about a given path").<br/><br/>Note: Paths are case-sensitive. The paths and path status endpoints will not return results if the wrong case is specified.

        '
      parameters:
      - name: volume_guid
        in: path
        description: Volume identifier
        required: true
        schema:
          type: string
      - name: filer_serial
        in: path
        description: Filer object identifier
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: Folder or File path (URL-encoded)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathData'
        '401':
          description: Authentication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Request throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - AuthToken: []
    post:
      tags:
      - Volumes
      summary: Refresh info about a given path
      description: 'Posting to this endpoint causes the NMC to request current information from the associated Edge Appliance(Filer) for the path (statting it). Once this is done, the path is considered to be a "known path" for the Get info on a specific path endpoint. Known paths are only cached for 10 minutes before expiring.<br/><br/>Note: Paths are case-sensitive. The paths and path status endpoints will not return results if the wrong case is specified.

        '
      operationId: refreshPathInfo
      parameters:
      - name: volume_guid
        in: path
        description: Volume identifier
        required: true
        schema:
          type: string
      - name: filer_serial
        in: path
        description: Filer object identifier
        required: true
