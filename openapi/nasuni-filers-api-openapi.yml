openapi: 3.2.0
info:
  title: Nasuni Filers API
  version: '1.0'
  description: 'Operations tagged Filers across 3 of this provider''s published API definitions: nasuni-nmc-v1-0-openapi.json, nasuni-nmc-v1-1-openapi.json, nasuni-nmc-v1-2-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://hostname/api/v1
- url: https://hostname/api/v1.1
- url: https://hostname/api/v1.2
security:
- AuthToken: []
tags:
- name: Filers
paths:
  /filers/:
    get:
      tags:
      - Filers
      summary: List all Filers
      parameters:
      - name: limit
        in: query
        description: The maximum number of objects to return
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 50
      - name: offset
        in: query
        description: The index of the first object to return
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: OK - Return status and configuration for all managed Filers.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Filer'
                - $ref: '#/components/schemas/Paging'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: The reason why the agent couldn't be authorized.
                    enum:
                    - Authentication credentials were not provided.
                    - Invalid token.
        '429':
          description: Request throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getFilers
      x-operation-id-source: derived
    servers:
    - url: https://hostname/api/v1
  /filers/{filer_serial}/:
    get:
      tags:
      - Filers
      summary: Get a Filer
      parameters:
      - name: filer_serial
        in: path
        description: Filer object identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK - Return status and configuration for the specified managed Filer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filer'
        '401':
          description: Authentication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getFilersByFilerSerial
      x-operation-id-source: derived
    patch:
      tags:
      - Filers
      summary: Update a Filer
      description: Update the Filer's settings with the given body.
      parameters:
      - name: filer_serial
        in: path
        description: Filer object identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filer_2'
        required: true
      responses:
        '202':
          description: Accepted - Filer has been sent a message
          headers:
            Location:
              description: URL to the associated message
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Request throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: body
      operationId: patchFilersByFilerSerial
      x-operation-id-source: derived
    servers:
    - url: https://hostname/api/v1
