    FilerConfigurationCIFS_2:
      type: object
      properties:
        aio_support:
          type: boolean
          description: Read only. Indicates whether Async IO is supported.
          readOnly: true
        deny_access:
          type: boolean
          description: Read only. Indicates whether denying a user access to a share is supported
          readOnly: true
        fruit_support:
          type: boolean
          description: Read only. Indicates whether Mac OS X Extensions are available.
          readOnly: true
        proto_level:
          type: string
          description: 'Read only. Indicates the CIFS protocol level of the Filer.


            * *SMB3* -- CIFS & SMB3 support.

            * *SMB2* -- CIFS & SMB2 support.

            * '''' -- CIFS support.

            '
          readOnly: true
          enum:
          - SMB3
          - SMB2
          - ''
        restrict_anonymous:
          type: boolean
          description: Set whether to restrict anonymous user access.
          readOnly: true
        roundup_size:
          type: string
          description: 'Set the Allocation roundup size.

            This rounds the file size on disk reported to clients. Disabled by

            default, this should only be enabled when the system is being

            accessed by older SMBv1 clients; otherwise, there may be a

            performance impact.

            May also affect file size reporting on some platforms.


            * `` - Allocation roundup size is 1 MiB (default value for Filers older than version 9.0).

            * `0` - Allocation roundup is disabled (default value for Filers version 9.0 and newer).

            * `1048576` - Allocation roundup size is 1 MiB.

            '
          readOnly: true
        smb3:
          type: boolean
          description: Indicates whether SMB3 is supported.
          readOnly: true
        smb_encrypt:
          type: boolean
          description: Indicates whether SMB Encryption is supported.
          readOnly: true
        unix_ext:
          type: boolean
          description: Set whether Enhanced Support for POSIX clients is enabled.
          readOnly: true
        veto_files:
          type: boolean
          description: Indicates whether blocking files is supported. This can be configured through Shares settings.
          readOnly: true
