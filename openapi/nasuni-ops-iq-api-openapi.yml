    VolumeTelemetryObjectCountsRecord:
      properties:
        appliance:
          type: string
          title: Appliance
          description: Appliance name/description
        serial_number:
          type: string
          title: Serial Number
          description: Appliance serial number
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds
        non_gl_file_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Non Gl File Count
          description: Count of non-Global File Lock files
        gl_file_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Gl File Count
          description: Count of Global File Lock files (excluded from time-to-protect)
        directory_count:
          type: integer
          title: Directory Count
          description: Count of directories
        volume_version:
          type: integer
          title: Volume Version
          description: Sequential snapshot version number
      type: object
      required:
      - appliance
      - serial_number
      - time
      - directory_count
      - volume_version
      title: VolumeTelemetryObjectCountsRecord
      description: Volume object counts record with appliance info.
    ApplianceTelemetryNetworkThroughputRecord:
      properties:
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds
        clients_in:
          anyOf:
          - type: integer
          - type: 'null'
          title: Clients In
          description: Bytes per second incoming from client connections
        clients_out:
          anyOf:
          - type: integer
          - type: 'null'
          title: Clients Out
          description: Bytes per second outgoing to client connections
        cloud_in:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cloud In
          description: Bytes per second incoming from cloud - high values suggest data ingestion
        cloud_out:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cloud Out
          description: Bytes/sec to cloud - high values suggest cache misses or restores
      type: object
      required:
      - time
      title: ApplianceTelemetryNetworkThroughputRecord
      description: Appliance network throughput record.
    VolumeTelemetryObjectCountsDto:
