components:
  schemas:
    VolumeTelemetryRequestDto:
      properties:
        period:
          type: string
          title: Period
          description: 'Time period in ISO 8601 format. Examples: ''PT1H'' (last 1 hour), ''P1D'' (last 1 day), ''2025-01-01T00:00:00Z/2025-01-02T00:00:00Z'' (specific interval), or millisecond timestamps ''1730390400000/1730476800000''. Minimum range: 6 minutes.'
        serial_numbers:
          items:
            type: string
            format: uuid
          type: array
          title: Serial Numbers
          description: Appliance serial numbers to filter data - ensures stability across DR events
        chart_width:
          anyOf:
          - type: integer
            maximum: 5200
            minimum: 100
          - type: 'null'
          title: Chart Width
          description: Chart width in pixels (100-5200) - affects sampling density
        smart_sampling:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Smart Sampling
          description: Enable optimized dataset for trend analysis with faster load times
      type: object
      required:
      - period
      - serial_numbers
      title: VolumeTelemetryRequestDto
      description: Request DTO for volume telemetry data (volume_id is in URL path).
    ApplianceTelemetryCpuLoadAvgGraphDto:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        items:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Items
          description: List of CPU load average records
        num_cores:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Cores
          description: CPU core count used for load comparison. Null when the core count is unavailable.
      type: object
      required:
      - items
      - num_cores
      title: ApplianceTelemetryCpuLoadAvgGraphDto
      description: CPU load average graph data with core count
    VolumeTelemetryProtectMeanRecords:
      properties:
        appliance:
          type: string
          title: Appliance
          description: Appliance name/description
        serial_number:
          type: string
          title: Serial Number
          description: Appliance serial number
        snapshots:
          items:
            $ref: '#/components/schemas/VolumeTelemetryProtectMeanRecord'
          type: array
          title: Snapshots
          description: Snapshot protection mean records for this appliance
      type: object
      required:
      - appliance
      - serial_number
      title: VolumeTelemetryProtectMeanRecords
      description: Volume protection mean records grouped by appliance.
    VolumeTelemetrySnapshotDetailsRecord:
      properties:
        appliance:
          type: string
          title: Appliance
          description: Appliance name/description
        serial_number:
          type: string
          title: Serial Number
          description: Appliance serial number
        volume:
          type: string
          title: Volume
          description: Volume identifier
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds when snapshot completed (same as metadata_snapshot_end)
        protect_mean:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Protect Mean
          description: Average time in seconds for files to be protected during this snapshot
        protect_max:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Protect Max
          description: Max time in seconds any file took to be protected during this snapshot
        data_snapshot_start:
          anyOf:
          - type: integer
          - type: 'null'
          title: Data Snapshot Start
          description: Timestamp in ms when P1 (data phase) started. Null=GFL-only snapshot
        data_snapshot_end:
          anyOf:
          - type: integer
          - type: 'null'
          title: Data Snapshot End
          description: Timestamp in ms when P1 (data phase) ended. Null=GFL-only snapshot
        metadata_snapshot_start:
          type: integer
          title: Metadata Snapshot Start
          description: Timestamp in ms when P2 (metadata phase) started
        metadata_snapshot_end:
          type: integer
          title: Metadata Snapshot End
          description: Timestamp in ms when P2 (metadata phase) ended (snapshot completion)
        oud:
          anyOf:
          - type: integer
          - type: 'null'
          title: Oud
          description: Oldest unprotected data age in seconds - time since oldest file was last protected
        file_count_ngl:
          anyOf:
          - type: integer
          - type: 'null'
          title: File Count Ngl
          description: Count of non-GFL files in snapshot. Null=GFL-only snapshot
        file_count_gl:
          anyOf:
          - type: integer
          - type: 'null'
          title: File Count Gl
          description: Count of Global File Lock files in snapshot
        file_count_total:
          anyOf:
          - type: integer
          - type: 'null'
          title: File Count Total
          description: Total count of all files in snapshot (NGL + GFL)
        dir_count:
          type: integer
          title: Dir Count
          description: Count of directories in snapshot
        volume_version:
          type: integer
          title: Volume Version
          description: Sequential snapshot version number for this volume
      type: object
      required:
      - appliance
      - serial_number
      - volume
      - time
      - metadata_snapshot_start
      - metadata_snapshot_end
      - dir_count
      - volume_version
      title: VolumeTelemetrySnapshotDetailsRecord
      description: 'Volume snapshot metadata record per appliance.


        This provides detailed snapshot information for each appliance, including:

        - When the data snapshot phase (P1) started and ended

        - When the metadata snapshot phase (P2) started and ended

        - Protection metrics and file counts at the time of snapshot'
    ApplianceTelemetryDiskLatencyRecord:
      properties:
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds
        io_time:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Io Time
          description: Time in milliseconds spent on I/O operations
        weighted_io_time:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Weighted Io Time
          description: Weighted I/O time in ms - much higher than io_time indicates saturation
      type: object
      required:
      - time
      title: ApplianceTelemetryDiskLatencyRecord
      description: Appliance disk latency record.
    ApplianceTelemetryMemoryUtilizationRecord:
      properties:
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds
        memory_used:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Memory Used
          description: Amount of used memory in KB
        memory_cached:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Memory Cached
          description: Amount of cached memory in KB
        memory_buffered:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Memory Buffered
          description: Amount of buffered memory in KB
      type: object
      required:
      - time
      title: ApplianceTelemetryMemoryUtilizationRecord
      description: Appliance memory utilization record (pre-v10.0.4).
    ApplianceTelemetryFileIqDiskIoRecord:
      properties:
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds
        file_iq_disk_io_reads:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: File Iq Disk Io Reads
          description: Number of read operations per second on File IQ disk
        file_iq_disk_io_writes:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: File Iq Disk Io Writes
          description: Number of write operations per second on File IQ disk
      type: object
      required:
      - time
      title: ApplianceTelemetryFileIqDiskIoRecord
      description: Appliance File IQ DB Disk IOPS record.
    ApplianceTelemetrySMBConnectionsRecord:
      properties:
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds
        connections:
          anyOf:
          - type: integer
          - type: 'null'
          title: Connections
          description: Number of active SMB sessions - sudden drops may indicate network issues
      type: object
      required:
      - time
      title: ApplianceTelemetrySMBConnectionsRecord
      description: Appliance SMB connections record.
    ApplianceHealthScoreStatisticsDto:
      properties:
        cpu_count:
          type: integer
          title: Cpu Count
          description: Reported CPU count for the appliance used when contextualizing load
          default: 0
        avg_load:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Avg Load
          description: Average load (0-n) across the sampled window rounded to two decimals
          default: '0'
        max_load:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Max Load
          description: Maximum load observed within the sampled window rounded to two decimals
          default: '0'
      type: object
      title: ApplianceHealthScoreStatisticsDto
      description: Summary statistics for appliance health score.
    ApplianceTelemetryMemoryUtilizationDetailsDto:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        items:
          items:
            $ref: '#/components/schemas/ApplianceTelemetryMemoryUtilizationDetailsRecord'
          type: array
          title: Items
          description: Detailed memory utilization records (v10.0.4+)
      type: object
      required:
      - items
      title: ApplianceTelemetryMemoryUtilizationDetailsDto
      description: List of appliance memory utilization details records
    ApplianceTelemetryCacheUtilizationRecord:
      properties:
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds
        cache_utilization:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Cache Utilization
          description: Percentage (0-100) of cache disk used - near 100% causes evictions and misses
      type: object
      required:
      - time
      title: ApplianceTelemetryCacheUtilizationRecord
      description: Appliance cache utilization record.
    VolumeTelemetryProtectMeanRecord:
      properties:
        time:
          type: integer
          title: Time
          description: Timestamp in milliseconds
        protect_mean:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Protect Mean
          description: Average time in seconds for files to be protected during this snapshot
        volume_version:
          type: integer
          title: Volume Version
          description: Sequential snapshot version number
      type: object
      required:
      - time
      - protect_mean
      - volume_version
      title: VolumeTelemetryProtectMeanRecord
      description: Volume protection mean record.
    ApplianceTelemetryCpuUsageDto:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        items:
          items:
            $ref: '#/components/schemas/ApplianceTelemetryCpuUsageRecord'
          type: array
          title: Items
          description: List of CPU usage records
      type: object
      required:
      - items
      title: ApplianceTelemetryCpuUsageDto
      description: List of appliance CPU usage records
    ApplianceTelemetryCacheDiskIoLatencyDto:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        items:
          items:
            $ref: '#/components/schemas/ApplianceTelemetryDiskIoLatencyRecord'
          type: array
          title: Items
          description: List of disk IO latency records
      type: object
      required:
      - items
      title: ApplianceTelemetryCacheDiskIoLatencyDto
      description: Cache disk IO latency response with embedded metadata
    ApplianceTelemetryCacheHitsMissesDto:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        items:
          items:
            $ref: '#/components/schemas/ApplianceTelemetryCacheHitsMissesRecord'
          type: array
          title: Items
          description: List of cache hit and miss records
      type: object
      required:
      - items
      title: ApplianceTelemetryCacheHitsMissesDto
      description: List of appliance cache hits/misses records
    VolumeTelemetryPushTimelineMetadataEventDto:
      properties:
        phase:
          type: string
          enum:
          - metadata_snapshot
          - metadata_snapshot_failed
          title: Phase
          description: 'Event type: 2 for successful metadata snapshot (P2), -2 for failed metadata snapshot'
        appliance:
          type: string
          title: Appliance
          description: Appliance name/description
        serial_number:
          type: string
          title: Serial Number
          description: Appliance serial number
        start_time:
          type: integer
          title: Start Time
          description: Timestamp in milliseconds when metadata snapshot phase started
        end_time:
          type: integer
          title: End Time
          description: Timestamp in milliseconds when metadata snapshot phase ended
        volume_version:
          type: integer
          title: Volume Version
          description: Sequential snapshot version number
      type: object
      required:
      - phase
      - appliance
      - serial_number
      - start_time
      - end_time
      - volume_version
      title: VolumeTelemetryPushTimelineMetadataEventDto
      description: 'Volume push timeline metadata event.


        Represents when metadata (directory structure, file info) was pushed during snapshot creation.'
    ApplianceTelemetryCorePerformanceDto:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        cpu_util:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Cpu Util
          description: CPU utilization as percentage (0-100)
        available_memory:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Available Memory
          description: Available memory (NOC field name is memUsage but represents available)
        fifteen_minute_load_average:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Fifteen Minute Load Average
          description: 15-min rolling average of processes in run queue or waiting for CPU
        time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Time
          description: Timestamp in milliseconds
        uptime:
          anyOf:
          - type: integer
          - type: 'null'
          title: Uptime
          description: System uptime in seconds
        num_cores:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Cores
          description: Number of CPU cores available on the appliance. Null when the core count is unavailable.
      type: object
      title: ApplianceTelemetryCorePerformanceDto
      description: Appliance core performance metrics
    VolumeTelemetryProtectMeanDto:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        items:
          items:
            $ref: '#/components/schemas/VolumeTelemetryProtectMeanRecords'
          type: array
          title: Items
          description: List of protection mean records grouped by appliance
      type: object
      required:
      - items
      title: VolumeTelemetryProtectMeanDto
      description: List of volume protection mean records
    ApplianceTelemetryFileIqDiskLatencyDto:
      properties:
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        items:
          items:
            $ref: '#/components/schemas/ApplianceTelemetryDiskLatencyRecord'
          type: array
          title: Items
          description: List of disk I/O latency records
      type: object
      required:
      - items
      title: ApplianceTelemetryFileIqDiskLatencyDto
