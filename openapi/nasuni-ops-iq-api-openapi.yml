        cache_io_writes:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Cache Io Writes
          description: Number of write operations per second performed by cache disk
      type: object
      required:
      - time
      title: ApplianceTelemetryCacheDiskIoRecord
      description: Appliance cache disk I/O record.
    ErrorResponse:
      properties:
        message:
          type: string
          title: Message
        detail:
          anyOf:
          - {}
          - type: 'null'
          title: Detail
      type: object
      required:
