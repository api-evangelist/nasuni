        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Telemetry metadata (help text, metric definitions)
        items:
          items:
            $ref: '#/components/schemas/VolumeTelemetryObjectCountsRecord'
          type: array
          title: Items
          description: List of object count records (files and directories)
      type: object
      required:
      - items
      title: VolumeTelemetryObjectCountsDto
      description: List of volume object counts records
