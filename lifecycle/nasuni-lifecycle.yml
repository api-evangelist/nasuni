deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Nasuni publishes NO deprecation policy, no sunset schedule, and no RFC 8594 Sunset/Deprecation
    headers. No operation in any of the seven harvested specs carries `deprecated: true`. Breaking
    changes ARE announced retrospectively in the NMC API version history (NMC 22.2 changed cloud
    credentials from `cred_id` to `filer_serial_number` + `cred_uuid` and removed the `links` field
    from CIFS and FTP endpoints) but with no advance-notice window stated. No Deprecation pointer
    is emitted in apis.yml, because there is no policy to point at.
  breaking_changes_recorded:
  - version: NMC 22.2 (API 1.2.0)
    change: >-
      Cloud credentials now identified by `filer_serial_number` and `cred_uuid` instead of
      `cred_id`.
    source: https://docs.api.nasuni.com/api/nmc/v120/versionhistory/
  - version: NMC 22.2 (API 1.2.0)
    change: CIFS and FTP endpoints no longer include the `links` field.
    source: https://docs.api.nasuni.com/api/nmc/v120/versionhistory/
