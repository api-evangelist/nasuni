  api_version: '1.2.0'
  date: null
  breaking: false
  additions:
  - Blocked Clients operations — block/unblock IP addresses and list blocked clients.
- release: NMC 22.2
  api_version: '1.2.0'
  date: null
  breaking: true
  highlights:
  - API version bumped to 1.2.0.
  additions:
  - 'Cloud Credentials: update a cloud credential.'
  breaking_changes:
