data_api_return_codes:
  source: https://docs.nasuni.com/docs/nasuni-data-api
  codes:
  - status: 200
    meaning: Success
  - status: 401
    meaning: >-
      Unauthorized — authentication failure. Verify username/password and that Mobile Access is
      enabled on the share.
  - status: 403
    meaning: Forbidden — authentication failure (version 10.1 only).
  - status: 410
    meaning: >-
      device_id is disabled on the Nasuni Edge Appliance for this device. Authorize using a
      different device_id.
